name: "Мобильная сборка APK"
on: [push, workflow_dispatch]

jobs:
  export-android:
    name: "Сборка APK в облаке"
    runs-on: ubuntu-24.04

    steps:
      - name: "Получение исходного кода"
        uses: actions/checkout@v4

      - name: "Установка .NET SDK"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: "Установка Java"
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "Исправление структуры папок"
        run: |
          mkdir -p src/Durak.Gameplay
          find . -maxdepth 1 -name "*.cs" -exec mv {} src/Durak.Gameplay/ \; 2>/dev/null || true
          if [ -f "Durak.Gameplay.csproj" ]; then
            mv Durak.Gameplay.csproj src/Durak.Gameplay/
          fi

      - name: "Автоматическая сборка через GitHub CDN"
        uses: firebelley/godot-export@v5.3.0
        with:
          godot_version: "4.3"
          is_mono: true
          export_debug: false
          relative_project_path: "./"
        env:
          EXPORT_PRESET: "Android"

      - name: "Загрузка готового APK файла"
        uses: actions/upload-artifact@v4
        with:
          name: durak3d-game-apk
          path: build/android/durak3d.apk
