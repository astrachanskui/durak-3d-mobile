name: "Мобильная сборка APK"
on: [push, workflow_dispatch]

jobs:
  export-android:
    name: "Сборка APK в облаке"
    runs-on: ubuntu-24.04

    steps:
      - name: "Получение исходного кода"
        uses: actions/checkout@v4

      - name: "Установка .NET SDK"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: "Установка Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "Установка Android SDK"
        uses: android-actions/setup-android@v3

      - name: "Установка NDK и build-tools"
        run: |
          yes | sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/23.2.8568313" >> $GITHUB_ENV

      - name: "Настройка Godot Editor Settings (Java + SDK пути)"
        run: |
          JAVA_PATH=$(dirname $(dirname $(readlink -f $(which java))))
          echo "JAVA_HOME=$JAVA_PATH" >> $GITHUB_ENV
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres << EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${{ env.ANDROID_SDK_ROOT }}"
          export/android/java_sdk_path = "$JAVA_PATH"
          export/android/debug_keystore = "${{ github.workspace }}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: "Скачивание Godot 4.3 .NET"
        run: |
          curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_mono_linux_x86_64.zip
          unzip godot.zip
          mv Godot_v4.3-stable_mono_linux_x86_64/Godot_v4.3-stable_mono_linux.x86_64 godot
          chmod +x godot

      - name: "Скачивание шаблонов экспорта"
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable.mono
          curl -L -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_mono_export_templates.tpz
          unzip templates.tpz -d /tmp
          mv /tmp/templates/* ~/.local/share/godot/export_templates/4.3.stable.mono/

      - name: "Генерация debug keystore"
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: "Pre-heating: импорт ресурсов проекта"
        run: |
          ./godot --headless --path . --import

      - name: "Сборка готового APK"
        run: |
          mkdir -p build/android
          ./godot --headless --path . --export-release "Android" build/android/durak3d.apk

      - name: "Загрузка готового APK файла"
        uses: actions/upload-artifact@v4
        with:
          name: durak3d-game-apk
          path: build/android/durak3d.apk
